[package]
name = "sqlite-schema"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "sqlite_schema"
path = "src/lib.rs"

[[bin]]
name = "sqlite-schema"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
